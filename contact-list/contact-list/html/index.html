<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-standalone="true">
    <main class="page">
        <header class="mast">
            <p class="eyebrow">Directory</p>
            <h1>Contact List</h1>
            <p class="lede">Every field is required. Contacts are listed by last name.</p>
            <p class="hint" id="storage-note" hidden>Contacts are saved in this browser.</p>
        </header>

        <p id="banner" class="banner" hidden role="status"></p>

        <div class="layout">
            <section class="panel" aria-labelledby="form-title">
                <div class="panel-head">
                    <h2 id="form-title">Add contact</h2>
                    <button class="text-link" id="cancel-edit" type="button" hidden>Cancel</button>
                </div>

                <form id="contact-form" action="#" method="post" novalidate>
                    <input type="hidden" name="id" id="contact-id" value="">

                    <div class="field">
                        <label for="first_name">First name</label>
                        <input id="first_name" name="first_name" type="text" maxlength="50" autocomplete="given-name" required aria-required="true">
                    </div>

                    <div class="field">
                        <label for="last_name">Last name</label>
                        <input id="last_name" name="last_name" type="text" maxlength="50" autocomplete="family-name" required aria-required="true">
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" maxlength="50" autocomplete="email" spellcheck="false" required aria-required="true">
                    </div>

                    <div class="field">
                        <label for="contact_number">Contact number</label>
                        <input id="contact_number" name="contact_number" type="text" inputmode="numeric" maxlength="15" autocomplete="tel" required aria-required="true" aria-describedby="contact_number-hint">
                        <p class="hint" id="contact_number-hint">Digits only, up to 15.</p>
                    </div>

                    <button class="button" id="save-button" type="submit">Add contact</button>
                </form>
            </section>

            <section class="panel" aria-labelledby="list-title">
                <div class="panel-head">
                    <h2 id="list-title">Contacts</h2>
                    <p class="count" id="count-label">0 people</p>
                </div>

                <p class="empty" id="empty-state">No contacts yet. Add the first one with the form.</p>

                <div class="table-wrap" id="table-wrap" hidden>
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Last name</th>
                                <th scope="col">First name</th>
                                <th scope="col">Email</th>
                                <th scope="col">Contact number</th>
                                <th scope="col"><span class="sr-only">Actions</span></th>
                            </tr>
                        </thead>
                        <tbody id="contact-rows"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
